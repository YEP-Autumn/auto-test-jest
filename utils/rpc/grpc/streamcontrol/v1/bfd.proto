// BFD / SBFD

syntax = "proto3";

package streamcontrol.v1;

option csharp_namespace = "StreamControl.V1";
option java_multiple_files = true;
option java_package = "io.streamcontrol.v1";
option go_package = "streamcontrol/v1;streamcontrolv1";

import "streamcontrol/v1/common.proto";
import "streamcontrol/v1/job.proto";
import "streamcontrol/v1/resource.proto";

message BfdSessionConfig {
  string name = 1;
  string local_address = 2;
  string remote_address = 3;
  bool ipv6 = 4;
  bool multihop = 5;
  uint32 tx_interval_us = 6;
  uint32 rx_interval_us = 7;
  uint32 echo_interval_us = 8;
  uint32 detect_multiplier = 9;
  string auth_type = 10;
  string auth_key = 11;
  uint32 auth_key_id = 12;
  bool sbfd = 13;
  string srv6_bsid = 14;
}

message BfdConfig {
  ResourceRef ref = 1;
  string name = 2;
  ResourceRef interface = 3;
  string role = 4;
  string time_unit = 5;
  repeated BfdSessionConfig sessions = 6;
  PropertyBag properties = 7;
}

message BfdActionRequest {
  ResourceRef config = 1;
  repeated string sessions = 2;
  string idempotency_key = 3;
}

message BfdDiagnosticRequest {
  ResourceRef config = 1;
  string session = 2;
  uint32 diagnostic_state = 3;
}

service BfdService {
  rpc Create(BfdConfig) returns (ResourceReply);                    // operator
  rpc Get(ResourceRef) returns (ResourceReply);                     // viewer
  rpc List(ListResourcesRequest) returns (ListResourcesReply);      // viewer
  rpc Update(UpdateResourceRequest) returns (ResourceReply);        // operator
  rpc Delete(ResourceRef) returns (JobReply);                       // operator
  rpc Start(BfdActionRequest) returns (JobReply);                   // operator
  rpc Stop(BfdActionRequest) returns (JobReply);                    // operator
  rpc AdminUp(BfdActionRequest) returns (JobReply);                 // operator
  rpc AdminDown(BfdActionRequest) returns (JobReply);               // operator
  rpc EnableDemand(BfdActionRequest) returns (JobReply);            // operator
  rpc DisableDemand(BfdActionRequest) returns (JobReply);           // operator
  rpc InitiatePoll(BfdActionRequest) returns (JobReply);            // operator
  rpc ResumePdus(BfdActionRequest) returns (JobReply);              // operator
  rpc StopPdus(BfdActionRequest) returns (JobReply);                // operator
  rpc SetDiagnostic(BfdDiagnosticRequest) returns (JobReply);       // operator
}
