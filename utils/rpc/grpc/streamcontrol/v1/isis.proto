// IS-IS（L1/L2、LSP/TLV、SR 预留）

syntax = "proto3";

package streamcontrol.v1;

option csharp_namespace = "StreamControl.V1";
option java_multiple_files = true;
option java_package = "io.streamcontrol.v1";
option go_package = "streamcontrol/v1;streamcontrolv1";

import "streamcontrol/v1/common.proto";
import "streamcontrol/v1/job.proto";
import "streamcontrol/v1/resource.proto";

enum IsisLevel {
  ISIS_LEVEL_UNSPECIFIED = 0;
  ISIS_LEVEL_1 = 1;
  ISIS_LEVEL_2 = 2;
  ISIS_LEVEL_1_2 = 3;
}

message IsisTlv {
  uint32 type = 1;
  bytes value = 2;
}

message IsisLspConfig {
  string lsp_id = 1;
  uint32 sequence = 2;
  uint32 lifetime_s = 3;
  uint32 metric = 4;
  bool overload = 5;
  repeated IsisTlv tlvs = 6;
}

message IsisConfig {
  ResourceRef ref = 1;
  ResourceRef interface = 2;
  string name = 3;
  string system_id = 4;
  string area = 5;
  IsisLevel level = 6;
  string network_type = 7;
  uint32 priority = 8;
  uint32 metric = 9;
  uint32 hello_interval_s = 10;
  uint32 hello_multiplier = 11;
  uint32 lsp_refresh_s = 12;
  uint32 lsp_retransmit_s = 13;
  uint32 lsp_size = 14;
  bool hello_padding = 15;
  bool graceful_restart = 16;
  bool bfd = 17;
  bool sr = 18;
  string auth = 19;
  repeated IsisLspConfig lsps = 20;
  PropertyBag properties = 21;
}

message IsisActionRequest {
  ResourceRef config = 1;
  repeated string lsps = 2;
  string idempotency_key = 3;
}

message IsisConfigRequest {
  ResourceRef ref = 1;
}

service IsisService {
  rpc Create(IsisConfig) returns (ResourceReply);                    // operator
  rpc Get(IsisConfigRequest) returns (ResourceReply);               // viewer
  rpc List(ListResourcesRequest) returns (ListResourcesReply);      // viewer
  rpc Update(UpdateResourceRequest) returns (ResourceReply);        // operator
  rpc Delete(IsisConfigRequest) returns (JobReply);                 // operator
  rpc Start(IsisActionRequest) returns (JobReply);                  // operator
  rpc Stop(IsisActionRequest) returns (JobReply);                   // operator
  rpc Establish(IsisActionRequest) returns (JobReply);              // operator
  rpc LspAdvertise(IsisActionRequest) returns (JobReply);           // operator
  rpc LspWithdraw(IsisActionRequest) returns (JobReply);            // operator
  rpc GracefulRestart(IsisActionRequest) returns (JobReply);        // operator
  rpc SendInSyncPdus(IsisActionRequest) returns (JobReply);         // operator
  rpc SendOutOfSyncPdus(IsisActionRequest) returns (JobReply);      // operator
}
