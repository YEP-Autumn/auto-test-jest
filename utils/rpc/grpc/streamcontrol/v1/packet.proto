// 报文结构与字段编辑模型
//
// 设计目标：
//   1. 覆盖引擎当前 11 种协议 / 75 个字段；
//   2. 字段值类型化，避免 PropertyBag 字符串解析；
//   3. 支持 Renix XetModifier 的 Type/Start/Step/Count/Offset/Mask/Seed/Repeat；
//   4. HeaderInstance 同时用于配置持久化与 gRPC 读回；
//   5. 计算字段默认由引擎自动重算；显式设置后保留用户值（可构造错包）。

syntax = "proto3";

package streamcontrol.v1;

option csharp_namespace = "StreamControl.V1";
option java_multiple_files = true;
option java_package = "io.streamcontrol.v1";
option go_package = "streamcontrol/v1;streamcontrolv1";

// 报文头类型。
// 1-9 与旧 extension.proto 保持数值兼容；10+ 为新增。
enum HeaderType {
  HEADER_TYPE_UNSPECIFIED = 0;
  HEADER_TYPE_ETHERNET = 1;
  HEADER_TYPE_VLAN = 2;
  HEADER_TYPE_IPV4 = 3;
  HEADER_TYPE_IPV6 = 4;
  HEADER_TYPE_TCP = 5;
  HEADER_TYPE_UDP = 6;
  HEADER_TYPE_GRE = 7;
  HEADER_TYPE_MPLS = 8;
  HEADER_TYPE_CUSTOM = 9;
  HEADER_TYPE_ARP = 10;
  HEADER_TYPE_ICMP = 11;
  HEADER_TYPE_ICMPV6 = 12;
  HEADER_TYPE_RAW = 13;         // 不是协议层：仅用于整帧 raw（templateString）
  HEADER_TYPE_DOT3 = 14;        // IEEE 802.3（dst/src/length）
  HEADER_TYPE_LLC = 15;         // IEEE 802.2 LLC
  HEADER_TYPE_SNAP = 16;        // LLC SNAP
  HEADER_TYPE_SNMP = 17;        // SNMP v1/v2c 43B 模板；任意 PDU 用 payload custom 承载
  HEADER_TYPE_IPV6_HOPOPTS = 18;  // IPv6 Hop-by-Hop Options
  HEADER_TYPE_IPV6_ROUTING = 19;  // IPv6 Routing Header
  HEADER_TYPE_IPV6_FRAGMENT = 20; // IPv6 Fragment Header
  HEADER_TYPE_IPV6_DSTOPTS = 21;  // IPv6 Destination Options
  HEADER_TYPE_VXLAN = 22;         // VXLAN（UDP 之上，后接内层 Ethernet）
  HEADER_TYPE_PPPOE = 23;         // PPPoE Session（8B：头 + PPP protocol）
  HEADER_TYPE_GTPU = 24;          // GTP-U（UDP 2152，后接内层 IP）
  HEADER_TYPE_IGMP = 25;          // IGMP（IPv4 proto 2，v1/v2/v3 query）
  HEADER_TYPE_DHCP = 26;          // DHCPv4（UDP 67/68：BOOTP 240B + options）
  HEADER_TYPE_PPPOE_DISCOVERY = 27; // PPPoE Discovery（0x8863，6B + tags）
  HEADER_TYPE_LLDP = 28;          // LLDP（EtherType 0x88CC，纯 TLV）
  HEADER_TYPE_LACP = 29;          // LACP（Slow Protocols 0x8809 subtype 1，110B）
  HEADER_TYPE_STP = 30;           // STP/RSTP BPDU（LLC 0x42，35/36B）
  HEADER_TYPE_DHCPV6 = 31;        // DHCPv6（UDP 546/547：4B 头 + 16 位 TLV）
}

enum PacketFieldType {
  PACKET_FIELD_TYPE_UNSPECIFIED = 0;
  PACKET_FIELD_TYPE_U8 = 1;
  PACKET_FIELD_TYPE_U16 = 2;       // 网络序
  PACKET_FIELD_TYPE_U32 = 3;       // 网络序
  PACKET_FIELD_TYPE_U64 = 4;
  PACKET_FIELD_TYPE_BITS = 5;      // 位域，配合 shift/mask
  PACKET_FIELD_TYPE_MAC = 6;       // 6 字节
  PACKET_FIELD_TYPE_IPV4 = 7;      // 4 字节
  PACKET_FIELD_TYPE_IPV6 = 8;      // 16 字节
  PACKET_FIELD_TYPE_BYTES = 9;     // 裸字节，长度 = width
}

enum PacketFieldFlag {
  PACKET_FIELD_FLAG_NONE = 0;
  PACKET_FIELD_FLAG_COMPUTED = 1;  // 未显式设置时由 seal 重算
  PACKET_FIELD_FLAG_DERIVED = 2;   // 未显式设置时由 seal 填长度
  PACKET_FIELD_FLAG_READONLY = 4;  // 语义只读；引擎默认不强制拦截
}

// 一个字段值。
// 整数/位域用 u64；MAC/IPv4/IPv6/BYTES 用 raw（网络序）。
message PacketFieldValue {
  oneof value {
    uint64 u64 = 1;
    bytes raw = 2;
  }
}

enum PacketModifierKind {
  PACKET_MODIFIER_KIND_UNSPECIFIED = 0;
  PACKET_MODIFIER_KIND_FIXED = 1;
  PACKET_MODIFIER_KIND_INCREMENT = 2;
  PACKET_MODIFIER_KIND_DECREMENT = 3;
  PACKET_MODIFIER_KIND_RANDOM = 4;
  PACKET_MODIFIER_KIND_LIST = 5;
}

enum PacketModifierScope {
  PACKET_MODIFIER_SCOPE_UNSPECIFIED = 0;
  PACKET_MODIFIER_SCOPE_FRAME = 1;   // 每帧递增（默认，Renix 行为）
  PACKET_MODIFIER_SCOPE_BURST = 2;   // 每 burst 递增
  PACKET_MODIFIER_SCOPE_STREAM = 3;  // 每流恒定（i = stream index）
}

// 字段跳变。
// kind=INCREMENT/DECREMENT：value = start + step * i（count>0 时序号 i 对 count 取模）。
// kind=RANDOM：在 [start, end] 内按 seed 生成；count/repeat 控制序列。
// kind=LIST：value = list[(offset + i) % len(list)]。
message PacketFieldModifier {
  PacketModifierKind kind = 1;
  PacketModifierScope scope = 2;

  PacketFieldValue start = 3;
  PacketFieldValue step = 4;
  PacketFieldValue end = 5;    // RANDOM 的上界
  repeated PacketFieldValue list = 6;

  uint32 count = 7;            // INCR/DECR: 序号 i 对 count 取模；RANDOM: 值数量
  uint32 offset = 8;           // Renix XetModifier.Offset；LIST: 起始下标
  uint64 mask = 9;             // 整数/位域掩码
  bytes mask_raw = 10;         // MAC/IPv6/bytes 掩码（网络序）

  uint32 seed = 11;            // RANDOM 种子
  bool repeat = 12;            // RANDOM/LIST 是否循环
  bool contain_repeat = 13;    // RANDOM 是否允许重复值
}

// 一个字段的配置。
// name 相对 header 实例；允许点分嵌套路径，兼容 Renix 自定义头。
message PacketField {
  string name = 1;             // 引擎名：src / ttl / src_port
  string legacy_name = 2;      // Renix 名：source / sourcePort

  oneof setting {
    PacketFieldValue fixed = 3;
    PacketFieldModifier modifier = 4;
  }
}

// IP/TCP 选项。
// type 使用 IANA 编号：0=EOL、1=NOP、7=Record Route、68=Timestamp、
// 131=LSRR、137=SSRR、148=Router Alert；TCP：2=MSS、3=WScale、
// 4=SACK permitted、5=SACK、8=Timestamps。
// data 不含 type/length；EOL/NOP 的 data 必须为空。
// 整组选项由引擎按 4 字节对齐，并把 IHL / TCP data offset 一起修正。
message LldpTlv {
  uint32 subtype = 1;             // Chassis/Port/Management address subtype
  bytes id = 2;                   // Chassis/Port ID bytes
  uint32 ttl = 3;
  string text = 4;                // Port/System Description, System Name
  uint32 capabilities = 5;        // System Capabilities
  uint32 enabled_capabilities = 6;
  uint32 address_subtype = 7;     // Management Address subtype
  bytes address = 8;
  uint32 interface_subtype = 9;
  uint32 interface_number = 10;
  bytes oid = 11;
  uint32 oui = 12;                // Organizationally Specific
  uint32 org_subtype = 13;
  bytes info = 14;
}

message Dhcpv4SubOption {
  uint32 code = 1;
  bytes data = 2;
}

message Dhcpv4Route {
  uint32 prefix_len = 1;
  bytes destination = 2;
  bytes next_hop = 3;
}

message Dhcpv4Option {
  repeated Dhcpv4SubOption sub_options = 1; // option 82
  repeated Dhcpv4Route routes = 2;          // option 121/249
}

message Dhcpv6SubOption {
  uint32 type = 1;
  bytes data = 2;
}

message Dhcpv6Option {
  uint32 iaid = 1;
  uint32 t1 = 2;
  uint32 t2 = 3;
  bytes address = 4;
  uint32 preferred = 5;
  uint32 valid = 6;
  uint32 prefix_len = 7;
  uint32 status_code = 8;
  string status_message = 9;
  bytes relay_message = 10;
  repeated Dhcpv6SubOption sub_options = 11;
}

message IgmpGroupRecord {
  uint32 record_type = 1;
  bytes multicast_address = 2;
  repeated bytes sources = 3;
  bytes aux_data = 4;
}

message IgmpOption {
  repeated bytes sources = 1;
  repeated IgmpGroupRecord group_records = 2;
}

message MstiRecord {
  uint32 flags = 1;
  uint32 regional_root_priority = 2;
  bytes regional_root_mac = 3;
  uint32 internal_root_path_cost = 4;
  uint32 bridge_priority = 5;
  uint32 port_priority = 6;
  uint32 remaining_hops = 7;
}

message MstiOption {
  repeated MstiRecord records = 1;
}

message HeaderOption {
  uint32 type = 1;
  bytes data = 2;
  // LLDP 常用 TLV 的结构化值；设置后 gateway 会生成结构化 layer_options。
  // 支持的 TLV：Chassis/Port/TTL/Name/Capabilities/Management/Org-Specific。
  LldpTlv lldp = 3;
  // DHCPv4 option 82（Relay Agent） / 121/249（Classless Route）的结构化值。
  Dhcpv4Option dhcpv4 = 4;
  // DHCPv6 Relay Message / IA_NA / IA_TA / IAADDR / IA_PD / IA Prefix / Status 结构化值。
  Dhcpv6Option dhcpv6 = 5;
  // IGMPv3 Query source 列表 / Membership Report group record 结构化值。
  // group_records 支持 record_type/multicast_address/sources/aux_data。
  IgmpOption igmp = 6;
  // MSTP MSTI Configuration Message；records 顺序即 MSTID。
  MstiOption msti = 7;
}

// 一个具体的报文头实例。
// repeated HeaderInstance 的顺序就是报文层顺序；index 仅用于显示/定位。
message HeaderInstance {
  HeaderType type = 1;
  string name = 2;             // 唯一实例名，例如 ipv4_1；空 = 自动生成
  uint32 index = 3;            // 0-based；列表顺序优先
  uint32 header_length = 4;    // 0 = 默认；>默认值用于 options 预留
  repeated PacketField fields = 5;
  repeated HeaderOption options = 6;  // IPv4/TCP、IPv6 hop/dst、ICMPv6 NDP、DHCP/DHCPv6、PPPoE tags、LLDP TLVs；需要完整层栈模式
  // 引擎层名。动态类（HeaderType.CUSTOM）必填，其他头留空。
  string proto_name = 7;
}

// 字段元数据，供 GUI 生成编辑器和做校验。
message HeaderProperty {
  string name = 1;             // 引擎名
  string legacy_name = 2;      // Renix 名
  string path = 3;             // 具体路径，例如 ipv4_1.src；无上下文时为空
  PacketFieldType type = 4;
  uint32 offset = 5;           // 相对头起始
  uint32 width = 6;            // 字节宽度
  uint32 shift = 7;            // BITS 专用
  uint64 mask = 8;             // BITS 专用；地址字段用 mask_raw
  bytes mask_raw = 9;          // 地址/字节字段掩码
  repeated PacketFieldFlag flags = 10;
  PacketFieldValue default_value = 11;
  string display_name = 12;
}

message HeaderTypeInfo {
  HeaderType type = 1;
  string type_name = 2;        // Renix 类型名：Ethernet.ethernetII / IPv4.ipv4
  string display_name = 3;
  uint32 default_length = 4;
  uint32 min_length = 5;
  uint32 max_length = 6;
  repeated PacketModifierScope supported_scopes = 7;
  repeated HeaderProperty properties = 8;
}
